version: '3.8'

services:
  dance-pose-api:
    build: .
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - MAX_CONTENT_LENGTH=104857600  # 100MB
      - RESULT_RETENTION_DAYS=7
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - dance_uploads:/app/uploads
      - dance_results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

volumes:
  dance_uploads:
  dance_results:
  redis_data:

networks:
  default:
    name: dance-pose-production